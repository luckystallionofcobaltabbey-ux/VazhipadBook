<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2222" />
      <stop offset="100%" stop-color="#5E1414" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#E5D3B3" stroke-opacity="0.35" stroke-width="4" />

  <!-- Subtle Aura Glow -->
  <circle cx="256" cy="185" r="135" fill="url(#flameGlow)" />

  <!-- Sacred Temple Gopuram Arch -->
  <path
    d="M126 392 V236 C126 164 184 114 256 114 C328 114 386 164 386 236 V392"
    fill="none"
    stroke="#E5D3B3"
    stroke-opacity="0.35"
    stroke-width="6"
  />

  <!-- Nilavilakku / Traditional Kerala Lamp -->
  <!-- Base Pedestal -->
  <path d="M188 386 H324 L310 364 H202 Z" fill="url(#goldGrad)" />
  <rect x="218" y="346" width="76" height="18" rx="6" fill="url(#goldGrad)" />

  <!-- Stem -->
  <path d="M244 268 H268 L274 346 H238 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="306" r="14" fill="#FDE68A" />

  <!-- Oil Bowl (Thara) -->
  <path
    d="M168 242 C180 270 218 282 256 282 C294 282 332 270 344 242 C320 248 292 250 256 250 C220 250 192 248 168 242 Z"
    fill="url(#goldGrad)"
  />

  <!-- Finial (Kalasam) Top -->
  <path d="M250 205 H262 L265 245 H247 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="196" r="10" fill="#FDE68A" />

  <!-- Flames (Left, Center, Right) -->
  <path d="M256 122 C272 146 276 166 256 184 C236 166 240 146 256 122 Z" fill="#FEF08A" />
  <path d="M256 142 C264 156 266 168 256 178 C246 168 248 156 256 142 Z" fill="#FFFFFF" />

  <path d="M174 208 C184 222 186 234 174 244 C162 234 164 222 174 208 Z" fill="#FDE047" />
  <path d="M338 208 C348 222 350 234 338 244 C326 234 328 222 338 208 Z" fill="#FDE047" />
</svg>
